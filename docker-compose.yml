# Mercurius. Name and file come from .env: COMPOSE_PROJECT_NAME, COMPOSE_FILE.
# The app joins the external network `web` so Nginx Proxy Manager reaches it as `mercurius:8080`.
# Data lives in project directories, not Docker volumes: storage/app, storage/postgres, storage/workspace
# (their contents are not in git).
# No ports are published to the host.

services:
  app:
    build:
      context: .
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: mercurius-app:${APP_VERSION:-dev}
    restart: unless-stopped
    # a ceiling for a leak, well above the usual ~100 MB: pg_dump and tar of an export run here too
    mem_limit: ${APP_MEMORY:-1g}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/app:/app/storage
      # files of the local Bot API server (profile telegram-api), read at the path it reports
      - ./storage/telegram-api:/var/lib/telegram-bot-api:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      internal:
      sandbox:
      browser:
      web:
        aliases:
          # Another instance on the same host takes its own name (WEB_ALIAS), or the proxy would spread requests.
          - ${WEB_ALIAS:-mercurius}

  # Optional: a local Telegram Bot API server (COMPOSE_PROFILES=telegram-api, TELEGRAM_API_URL=http://telegram-api:8081).
  # By default the bot works with the cloud Bot API. Files up to 2000 MB; TELEGRAM_API_ID and TELEGRAM_API_HASH from
  # my.telegram.org. An HTTP proxy in TELEGRAM_PROXY carries its webhook requests.
  # spec: brief/channels.md#telegram-прокси-и-локальный-сервер-bot-api
  telegram-api:
    profiles: ["telegram-api"]
    build:
      context: services/telegram-bot-api
    image: mercurius-telegram-api:7232881
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      # only for the health check of the image and its watchdog: getMe and the webhook queue (probe.sh)
      # spec: brief/channels.md#здоровье-локального-сервера-bot-api
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./storage/telegram-api:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal

  # The built-in mail server (MCP, module mercurius-mail-mcp in mcp/mail, COMPOSE_PROFILES=mail, MAIL_MCP_TOKEN): IMAP and
  # SMTP of the mailboxes the participants connected. It keeps no credentials: the app sends the mailbox of a call in headers.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  mail-mcp:
    profiles: ["mail"]
    build:
      context: mcp/mail
    image: mercurius-mail-mcp:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MAIL_MCP_TOKEN: ${MAIL_MCP_TOKEN:-}
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module media-video (COMPOSE_PROFILES=media-video, MEDIA_VIDEO_TOKEN): ffmpeg behind a small API, the frames
  # and the sound of a video for the media tool when no video model is set. Its own repository, a submodule.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  media-video:
    profiles: ["media-video"]
    build:
      context: services/media-video
    image: mercurius-media-video:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MEDIA_VIDEO_TOKEN: ${MEDIA_VIDEO_TOKEN:-}
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module media-docs (COMPOSE_PROFILES=media-docs, MEDIA_DOCS_TOKEN): the text of office documents and PDF,
  # and new docx, xlsx, pptx; each file is parsed in a child process with limits. Its own repository, a submodule.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  media-docs:
    profiles: ["media-docs"]
    build:
      context: services/media-docs
    image: mercurius-media-docs:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MEDIA_DOCS_TOKEN: ${MEDIA_DOCS_TOKEN:-}
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # The browser of the agent: Chromium under puppeteer-core with a small API. Its own network: it sees the internet
  # and the app's requests, not the database, the sandbox or the executor; every page request is checked against
  # internal addresses (services/browser/guard.js). Module mercurius-browser: COMPOSE_PROFILES=browser. Profiles with logins live in storage/browser.
  browser:
    profiles: ["browser"]
    build:
      context: services/browser
    image: mercurius-browser:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
    volumes:
      - ./storage/browser:/profiles
    shm_size: 512m
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - browser

  postgres:
    # pinned by digest, as the base of the app image
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY:-2g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # A subdirectory: initdb refuses a non-empty directory, and storage/postgres keeps its .keep file.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - internal

  # Sandbox: commands and files of the agent, one Unix user per participant. No core secrets, no database,
  # no web network; root with a minimal capability set, every operation runs as the participant.
  # spec: brief/agent-loop.md#песочница
  sandbox:
    build:
      context: .
      target: sandbox
    image: mercurius-sandbox:${APP_VERSION:-dev}
    restart: unless-stopped
    # tini as PID 1 reaps killed orphans; otherwise zombies stay and count against the process limit.
    init: true
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    cpus: ${SANDBOX_CPUS:-2}
    mem_limit: ${SANDBOX_MEMORY:-4g}
    pids_limit: ${SANDBOX_PIDS:-512}
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      # spec: brief/agent-loop.md#песочница — /proc is remounted with hidepid at start: participants do not
      # see each other's processes; commands run without capabilities (setpriv, no-new-privileges)
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=512m,nosuid
    volumes:
      - ./storage/workspace:/workspace
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9000/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - sandbox

  # Test runner, started only on demand: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # A separate database: integration tests never touch the application data.
      POSTGRES_DB: ${POSTGRES_DB}_test
      # The SSH server of the tests; real servers of the owner are never touched by them.
      SSH_TEST_HOST: sshd-test
    depends_on:
      postgres:
        condition: service_healthy
      sshd-test:
        condition: service_started
    networks:
      - internal

  # An SSH server for the integration tests of SSH, on demand with the test profile.
  sshd-test:
    profiles: ["test"]
    build:
      context: .docker/sshd-test
    networks:
      - internal

  # Sandbox tests (users, processes, files), on demand: docker compose --profile test run --rm sandbox-test
  sandbox-test:
    profiles: ["test"]
    build:
      context: .
      target: sandbox-test
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      # spec: brief/agent-loop.md#песочница — /proc is remounted with hidepid at start: participants do not
      # see each other's processes; commands run without capabilities (setpriv, no-new-privileges)
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=512m,nosuid
    networks:
      - sandbox

networks:
  internal:
  # The app and the browser only.
  browser:
  # A fixed subnet. The sandbox may reach the host and the LAN (owner's decision): no firewall rule is set for it.
  # spec: brief/agent-loop.md#песочница
  sandbox:
    ipam:
      config:
        # Another instance on the same host needs its own subnet.
        - subnet: ${SANDBOX_SUBNET:-172.31.250.0/24}
  web:
    external: true
