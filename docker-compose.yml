# Mercurius. Name and file come from .env: COMPOSE_PROJECT_NAME, COMPOSE_FILE.
# The app joins the external network `web` so Nginx Proxy Manager reaches it as `mercurius:8080`.
# No ports are published to the host.

services:
  app:
    build:
      context: .
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: mercurius-app:${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      internal:
      web:
        aliases:
          - mercurius

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - internal

  # Test runner, started only on demand: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # A separate database: integration tests never touch the application data.
      POSTGRES_DB: ${POSTGRES_DB}_test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
  web:
    external: true
