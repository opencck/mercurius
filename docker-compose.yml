# Mercurius. Name and file come from .env: COMPOSE_PROJECT_NAME, COMPOSE_FILE.
# The app joins the external network `web` so Nginx Proxy Manager reaches it as `mercurius:8080`.
# Data lives in project directories, not Docker volumes: storage/app, storage/postgres, storage/workspace
# (their contents are not in git).
# No ports are published to the host.

services:
  app:
    build:
      context: .
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: mercurius-app:${APP_VERSION:-dev}
    restart: unless-stopped
    # a ceiling for a leak, well above the usual ~100 MB: pg_dump and tar of an export run here too
    mem_limit: ${APP_MEMORY:-1g}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/app:/app/storage
      # files of the local Bot API server (profile telegram-api), read at the path it reports
      - ./storage/telegram-api:/var/lib/telegram-bot-api:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      internal:
      sandbox:
      browser:
      web:
        aliases:
          # Another instance on the same host takes its own name (WEB_ALIAS), or the proxy would spread requests.
          - ${WEB_ALIAS:-mercurius}

  # Optional: a local Telegram Bot API server (COMPOSE_PROFILES=telegram-api, TELEGRAM_API_URL=http://telegram-api:8081).
  # By default the bot works with the cloud Bot API. Files up to 2000 MB; TELEGRAM_API_ID and TELEGRAM_API_HASH from
  # my.telegram.org. An HTTP proxy in TELEGRAM_PROXY carries its webhook requests.
  # spec: brief/channels.md#telegram-прокси-и-локальный-сервер-bot-api
  telegram-api:
    profiles: ["telegram-api"]
    build:
      context: services/telegram-bot-api
    image: mercurius-telegram-api:7232881
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      # only for the health check of the image and its watchdog: getMe and the webhook queue (probe.sh)
      # spec: brief/channels.md#здоровье-локального-сервера-bot-api
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./storage/telegram-api:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal

  # The built-in mail server (MCP, module mercurius-mail-mcp in mcp/mail, COMPOSE_PROFILES=mail, MAIL_MCP_TOKEN): IMAP and
  # SMTP of the mailboxes the participants connected. It keeps no credentials: the app sends the mailbox of a call in headers.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  mail-mcp:
    profiles: ["mail"]
    build:
      context: mcp/mail
    image: mercurius-mail-mcp:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MAIL_MCP_TOKEN: ${MAIL_MCP_TOKEN:-}
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module media-video (COMPOSE_PROFILES=media-video, MEDIA_VIDEO_TOKEN): ffmpeg behind a small API, the frames
  # and the sound of a video for the media tool when no video model is set. Its own repository, a submodule.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  media-video:
    profiles: ["media-video"]
    build:
      context: services/media-video
    image: mercurius-media-video:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MEDIA_VIDEO_TOKEN: ${MEDIA_VIDEO_TOKEN:-}
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module claude-code (COMPOSE_PROFILES=claude-code, CLAUDE_CODE_TOKEN, CLAUDE_CODE_URL): Claude by the owner's
  # subscription — the official Claude Code as a one-shot client of a model call. Its own repository, a submodule. The
  # sign-in of the CLI lives in storage/claude-code; the container runs as CLAUDE_CODE_UID so that folder stays 700.
  # spec: brief/models.md#claude-по-подписке
  claude-code:
    profiles: ["claude-code"]
    build:
      context: services/claude-code
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.330}
    image: mercurius-claude-code:${APP_VERSION:-dev}
    restart: unless-stopped
    # a stopped CLI leaves its helper process behind: init reaps it, PHP as the first process would not
    init: true
    user: "${CLAUDE_CODE_UID:-10050}:${CLAUDE_CODE_GID:-10050}"
    environment:
      CLAUDE_CODE_TOKEN: ${CLAUDE_CODE_TOKEN:-}
      CLAUDE_CODE_MAX_CONCURRENT: ${CLAUDE_CODE_MAX_CONCURRENT:-4}
      # one way out for the request to the API and for what the CLI sends by itself
      # spec: brief/models.md#сеть-модуля-claude
      VLESS_URI: ${VLESS_URI:-}
      CLAUDE_CODE_PROXY: ${CLAUDE_CODE_PROXY:-}
    volumes:
      - ./storage/claude-code:/data/claude
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module whisper (module mercurius-whisper in services/whisper, COMPOSE_PROFILES=whisper, WHISPER_TOKEN):
  # speech to text on this host, faster-whisper behind an OpenAI-compatible /v1/audio/transcriptions — voice messages
  # go to no provider and spend no tokens. The model is downloaded once to storage/whisper. The agent calls it as a
  # model of its own: MEDIA_ENDPOINTS=whisper=http://whisper:8000/v1, MEDIA_SPEECH_MODELS=custom:whisper/small, the
  # token — the vault secret media-endpoint-whisper.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  whisper:
    profiles: ["whisper"]
    build:
      context: services/whisper
    image: mercurius-whisper:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      WHISPER_TOKEN: ${WHISPER_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      WHISPER_MAX_MB: ${WHISPER_MAX_MB:-25}
      WHISPER_TIMEOUT: ${WHISPER_TIMEOUT:-300}
    volumes:
      - ./storage/whisper:/models
    # small takes about 0.8 GB, turbo about 1.7 GB
    mem_limit: ${WHISPER_MEMORY:-2g}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Optional module media-docs (COMPOSE_PROFILES=media-docs, MEDIA_DOCS_TOKEN): the text of office documents and PDF,
  # and new docx, xlsx, pptx; each file is parsed in a child process with limits. Its own repository, a submodule.
  # spec: brief/skills-mcp.md#модули-сервисы-mcp-и-скиллы
  media-docs:
    profiles: ["media-docs"]
    build:
      context: services/media-docs
    image: mercurius-media-docs:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      MEDIA_DOCS_TOKEN: ${MEDIA_DOCS_TOKEN:-}
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # The browser of the agent: Chromium under puppeteer-core with a small API. Its own network: it sees the internet
  # and the app's requests, not the database, the sandbox or the executor; every page request is checked against
  # internal addresses (services/browser/guard.js). Module mercurius-browser: COMPOSE_PROFILES=browser. Profiles with logins live in storage/browser.
  browser:
    profiles: ["browser"]
    build:
      context: services/browser
    image: mercurius-browser:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      # the way out: the VLESS tunnel of the installation (vless-proxy below) when VLESS_URI is set, else BROWSER_PROXY
      # (socks5://, socks5h://, http://, with user:password if needed), else directly
      # spec: brief/internet.md#как-сделано-поиск-чтение-и-браузер
      BROWSER_VIA_VLESS: ${VLESS_URI:+1}
      BROWSER_VLESS_PROXY: http://vless-proxy:8080
      BROWSER_PROXY: ${BROWSER_PROXY:-}
    volumes:
      - ./storage/browser:/profiles
    shm_size: 512m
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - browser

  # The VLESS tunnel for the browser: Chromium speaks only HTTP and SOCKS proxies, so vless-proxy of rekryt/amphp-vless
  # (already in the image of the app) opens an HTTP door to the tunnel in the network of the browser. The password is
  # the token of the browser; without VLESS_URI the service only waits, and the browser goes its other way.
  # spec: brief/internet.md#как-сделано-поиск-чтение-и-браузер
  vless-proxy:
    profiles: ["browser"]
    image: mercurius-app:${APP_VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["sh", "-c", "if [ -z \"$$VLESS_URI\" ]; then exec sleep infinity; fi; exec php vendor/bin/vless-proxy --http=0.0.0.0:8080 --quiet"]
    environment:
      VLESS_URI: ${VLESS_URI:-}
      VLESS_PROXY_USER: browser
      VLESS_PROXY_PASSWORD: ${BROWSER_TOKEN:-}
    mem_limit: 256m
    pids_limit: 256
    read_only: true
    # PHP keeps its lock files in /tmp
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - browser

  postgres:
    # pinned by digest, as the base of the app image
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY:-2g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # A subdirectory: initdb refuses a non-empty directory, and storage/postgres keeps its .keep file.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - internal

  # Sandbox: commands and files of the agent, one Unix user per participant. No core secrets, no database,
  # no web network; root with a minimal capability set, every operation runs as the participant.
  # spec: brief/agent-loop.md#песочница
  sandbox:
    build:
      context: .
      target: sandbox
    image: mercurius-sandbox:${APP_VERSION:-dev}
    restart: unless-stopped
    # tini as PID 1 reaps killed orphans; otherwise zombies stay and count against the process limit.
    init: true
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    cpus: ${SANDBOX_CPUS:-2}
    mem_limit: ${SANDBOX_MEMORY:-4g}
    pids_limit: ${SANDBOX_PIDS:-512}
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      # spec: brief/agent-loop.md#песочница — /proc is remounted with hidepid at start: participants do not
      # see each other's processes; commands run without capabilities (setpriv, no-new-privileges)
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=512m,nosuid
    volumes:
      - ./storage/workspace:/workspace
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9000/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - sandbox

  # Test runner, started only on demand: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # A separate database: integration tests never touch the application data.
      POSTGRES_DB: ${POSTGRES_DB}_test
      # The SSH server of the tests; real servers of the owner are never touched by them.
      SSH_TEST_HOST: sshd-test
    depends_on:
      postgres:
        condition: service_healthy
      sshd-test:
        condition: service_started
    networks:
      - internal

  # An SSH server for the integration tests of SSH, on demand with the test profile.
  sshd-test:
    profiles: ["test"]
    build:
      context: .docker/sshd-test
    networks:
      - internal

  # Sandbox tests (users, processes, files), on demand: docker compose --profile test run --rm sandbox-test
  sandbox-test:
    profiles: ["test"]
    build:
      context: .
      target: sandbox-test
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      # spec: brief/agent-loop.md#песочница — /proc is remounted with hidepid at start: participants do not
      # see each other's processes; commands run without capabilities (setpriv, no-new-privileges)
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=512m,nosuid
    networks:
      - sandbox

networks:
  internal:
  # The app and the browser only.
  browser:
  # A fixed subnet. The sandbox may reach the host and the LAN (owner's decision): no firewall rule is set for it.
  # spec: brief/agent-loop.md#песочница
  sandbox:
    ipam:
      config:
        # Another instance on the same host needs its own subnet.
        - subnet: ${SANDBOX_SUBNET:-172.31.250.0/24}
  web:
    external: true
