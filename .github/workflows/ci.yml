name: CI

# Economical by design: one job, PHP 8.2 only, skipped for documentation-only changes,
# superseded runs are cancelled. Tests that need network or secrets (group "integration")
# run on the project server, not here.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'notes/**', 'plans/**', 'references/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'notes/**', 'plans/**', 'references/**']
  workflow_dispatch:
    inputs:
      php:
        description: PHP version
        default: '8.2'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The package submodules (installed as Composer path repositories) and the built-in skill the tests read.
      # Reference submodules (references/) are large and not needed for the checks.
      - name: Package submodules
        run: git submodule update --init --depth 1 packages/llm packages/connectors packages/messenger packages/search packages/i18n packages/mcp-client packages/memory packages/peer skills/skill-creator

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php || '8.2' }}
          extensions: pgsql, pcntl, sockets
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Analyzer cache
        uses: actions/cache@v4
        with:
          path: var/cache
          key: analyzers-${{ runner.os }}-${{ github.sha }}
          restore-keys: analyzers-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer check
